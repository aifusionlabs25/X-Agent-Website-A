name: Apply Evan route map

on:
  push:
    branches:
      - codex/evan-live-route-map
    paths:
      - .github/evan-route-map.patch.gz.b64
      - .github/workflows/apply-evan-route-map.yml

permissions:
  contents: write

jobs:
  apply-route-map:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out route-map branch
        uses: actions/checkout@v4
        with:
          ref: codex/evan-live-route-map

      - name: Apply verified source patch
        run: |
          base64 --decode .github/evan-route-map.patch.gz.b64 > /tmp/evan-route-map.patch.gz
          gzip --decompress --stdout /tmp/evan-route-map.patch.gz > /tmp/evan-route-map.patch
          git apply --check /tmp/evan-route-map.patch
          git apply /tmp/evan-route-map.patch

      - name: Synchronize dependency lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit clean route-map source
        run: |
          git rm .github/evan-route-map.patch .github/evan-route-map.patch.gz.b64 .github/workflows/apply-evan-route-map.yml
          git add app/globals.css components/evan/EvanMovePlanner.tsx components/evan/EvanRouteMap.tsx config/anam/evan-move-planner-client-tool.json config/anam/evan/EVAN_ANAM_SYSTEM_PROMPT_2026-07-16.md lib/anam/evan-move-planner.ts package.json package-lock.json tests/evan-anam-config.test.mjs tests/evan-move-planner.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add Evan live route map"
          git push origin HEAD:codex/evan-live-route-map
