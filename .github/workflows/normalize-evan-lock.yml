name: Normalize Evan route map lockfile

on:
  push:
    branches:
      - codex/evan-live-route-map
    paths:
      - .github/workflows/normalize-evan-lock.yml

permissions:
  contents: write

jobs:
  normalize-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out route-map branch
        uses: actions/checkout@v4
        with:
          ref: codex/evan-live-route-map
          fetch-depth: 0

      - name: Restore and update lockfile with repository line endings
        run: |
          git checkout f0838b1958142cca5739fd167e344818791cd7d4 -- package-lock.json
          npm install --package-lock-only --ignore-scripts
          node -e "const fs=require('fs');const p='package-lock.json';const s=fs.readFileSync(p,'utf8').replace(/\r?\n/g,'\r\n');fs.writeFileSync(p,s)"

      - name: Commit normalized lockfile
        run: |
          git rm .github/workflows/normalize-evan-lock.yml
          git add package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Normalize Evan route map lockfile"
          git push origin HEAD:codex/evan-live-route-map
